<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
    {% block title %}Book Haven | Hearing God's Voice Through Every Book{% endblock %}
</title>

<meta name="description" content="{% block meta_description %}Discover inspiring Godly and motivational books that strengthen faith, build character, and transform lives. Shop quality Christian books, devotionals, inspirational titles, and personal growth resources at Book Haven.{% endblock %}">

<meta name="keywords" content="{% block meta_keywords %}Godly books, motivational books, Christian books, inspirational books, faith books, devotionals, spiritual growth books, personal development books, gospel books, books online Nigeria{% endblock %}">

<meta name="author" content="Book Haven">
<meta name="robots" content="index, follow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="canonical" href="{% block canonical_url %}{{ request.url }}{% endblock %}">

    <meta property="og:type" content="{% block og_type %}website{% endblock %}">
    <meta property="og:title" content="{% block og_title %}Book Haven | Godly and Motivational Books{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Explore Godly and motivational books that inspire faith, purpose, discipline, and personal growth.{% endblock %}">
    <meta property="og:url" content="{% block og_url %}{{ request.url }}{% endblock %}">
    <meta property="og:site_name" content="Book Haven">
    <meta property="og:image" content="{% block og_image %}{{ url_for('static', filename='images/default-book.jpg', _external=True) }}{% endblock %}">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block twitter_title %}Book Haven | Godly and Motivational Books{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}Explore Godly and motivational books that inspire faith, purpose, discipline, and personal growth.{% endblock %}">
    <meta name="twitter:image" content="{% block twitter_image %}{{ url_for('static', filename='images/default-book.jpg', _external=True) }}{% endblock %}">
    
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <style>
        .hero {
            background: linear-gradient(rgba(74, 112, 67, 0.85), rgba(74, 112, 67, 0.85)), 
                        url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?ixlib=rb-4.0.3&auto=format&fit=crop&w=2340&q=80');
            background-size: cover;
            background-position: center;
            color: white;
            padding: 120px 0;
        }
        
        .ad-box {
            border: 2px solid #4A7043;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .carousel-caption {
            background: rgba(0,0,0,0.7);
            border-radius: 10px;
        }
        
        .book-card {
            transition: transform 0.3s ease;
        }
        
        .book-card:hover {
            transform: translateY(-10px);
        }
    </style>

    {% block structured_data %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BookStore",
  "name": "Book Haven",
  "url": "{{ request.url_root.rstrip('/') }}",
  "description": "An online bookstore for Godly and motivational books that inspire faith, spiritual growth, and personal development.",
  "image": "{{ url_for('static', filename='images/default-book.jpg', _external=True) }}",
  "address": {
    "@type": "PostalAddress",
    "addressCountry": "Nigeria"
  },
  "sameAs": []
}
</script>
{% endblock %}
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="{{ url_for('main.home') }}">
                📖 Book Haven
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('books.list_books') }}">Books</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('cart.view') }}">Cart</a></li>
                    {% if current_user.is_authenticated %}
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('auth.logout') }}">Logout</a></li>
                    {% else %}
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('auth.login') }}">Login</a></li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
<style>
    body {
    font-family: 'Poppins', system-ui, sans-serif;
    background-color: #f8f9fa;
}

.navbar-brand {
    color: #FFD700 !important;
    font-weight: 700;
}

.ad-box img, .ad-box video {
    width: 100%;
    height: auto;
    display: block;
}

.carousel-item img {
    height: 520px;
    object-fit: cover;
}

.card {
    transition: all 0.3s ease;
}

.card:hover {
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    transform: translateY(-5px);
}

.btn-success {
    background-color: #4A7043;
    border-color: #4A7043;
}

.btn-success:hover {
    background-color: #3d5c36;
    border-color: #3d5c36;
}
</style>
