<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Book</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .form-container {
            max-width: 900px;
            margin: auto;
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .form-title {
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="form-container">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="form-title">Add New Book</h2>
            <a href="{{ url_for('admin.manage_books') }}" class="btn btn-dark">Back</a>
        </div>

        <form method="POST" enctype="multipart/form-data">

            <div class="row g-3">

                <!-- Title -->
                <div class="col-md-6">
                    <label class="form-label">Book Title</label>
                    <input type="text" name="title" class="form-control" required>
                </div>

                <!-- Author -->
                <div class="col-md-6">
                    <label class="form-label">Author</label>
                    <input type="text" name="author" class="form-control" required>
                </div>

                <!-- ISBN -->
                <div class="col-md-6">
                    <label class="form-label">ISBN</label>
                    <input type="text" name="isbn" class="form-control">
                </div>

                <!-- Year -->
                <div class="col-md-6">
                    <label class="form-label">Year of Publication</label>
                    <input type="number" name="year" class="form-control" min="1000" max="2100">
                </div>

                <!-- Prices -->
                <div class="col-md-6">
                    <label class="form-label">PDF Price (₦)</label>
                    <input type="number" step="0.01" name="pdf_price" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Hard Copy Price (₦)</label>
                    <input type="number" step="0.01" name="hardcopy_price" class="form-control" required>
                </div>

                <!-- Description -->
                <div class="col-12">
                    <label class="form-label">Book Description</label>
                    <textarea name="description" rows="4" class="form-control" required></textarea>
                </div>

                <!-- Cover Image -->
                <div class="col-md-6">
                    <label class="form-label">Book Cover Image</label>
                    <input type="file" name="cover_image" class="form-control" accept="image/*">
                </div>

                <!-- PDF File -->
                <div class="col-md-6">
                    <label class="form-label">Upload PDF File</label>
                    <input type="file" name="pdf_file" class="form-control" accept=".pdf">
                </div>

                <!-- Featured -->
                <div class="col-12">
                    <div class="form-check">
                        <input type="checkbox" name="is_featured" class="form-check-input" id="featured">
                        <label class="form-check-label" for="featured">
                            Mark as Featured Book
                        </label>
                    </div>
                </div>

                <!-- Submit -->
                <div class="col-12">
                    <button type="submit" class="btn btn-success w-100">
                        Add Book
                    </button>
                </div>

            </div>

        </form>

    </div>
</div>

</body>
</html>
